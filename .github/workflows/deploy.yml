name: Deploy to IBM Cloud

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Install IBM Cloud CLI
      run: |
        curl -fsSL https://clis.cloud.ibm.com/install/linux | sh ###curl -fsSL https://clas.ibm.com/install/linux | sh
        ibmcloud plugin install container-registry
        ibmcloud plugin install code-engine

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: terraform init

###añadido manualmente
    - name: Terraform Plan
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: terraform plan -out=tfplan

    - name: Terraform Apply
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: terraform apply -auto-approve

    - name: Login to IBM Cloud
      run: |
        ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} --no-region
        ibmcloud target -g cardif-poc-rg -r br-sao

    - name: Cleanup on Failure
      if: failure()
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: |
        echo "Previous step failed, cleaning up resources..."
        terraform destroy -auto-approve

    - name: Build and push Docker image
      run: |
        # Login to IBM Cloud Container Registry
        ibmcloud cr login
        # Build the image
        docker build -t br.icr.io/cardif-poc-namespace/cardif-poc:latest .
        # Push the image
        docker push br.icr.io/cardif-poc-namespace/cardif-poc:latest

    - name: Deploy to IBM Cloud Code Engine
      run: |
        # Create or update the Code Engine application
        ibmcloud ce project select -n cardif-poc-project
        ibmcloud ce application create \
          --name cardif-poc-app \
          --image br.icr.io/cardif-poc-namespace/cardif-poc:latest \
          --min-scale 1 \
          --max-scale 3 \
          --port 8080