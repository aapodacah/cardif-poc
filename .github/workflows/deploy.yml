name: Deploy to IBM Cloud

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Install IBM Cloud CLI
      run: |
        curl -fsSL https://clis.cloud.ibm.com/install/linux | sh ###curl -fsSL https://clas.ibm.com/install/linux | sh
        ibmcloud plugin install container-registry
        ibmcloud plugin install code-engine

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: terraform init

    - name: Terraform Plan
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: terraform plan -out=tfplan

    - name: Terraform Apply
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: terraform apply -auto-approve

    - name: Login to IBM Cloud
      run: |
        ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} --no-region
        ibmcloud target -g cardif-poc-rg -r br-sao

    - name: Cleanup on Failure
      if: failure()
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: |
        echo "Previous step failed, cleaning up resources..."
        terraform destroy -auto-approve

    - name: Build and push Docker image
      run: |
        # Login to IBM Cloud Container Registry
        ibmcloud cr login
        # Build the image
        docker build -t br.icr.io/cardif-poc-namespace/cardif-poc:latest .
        # Push the image
        docker push br.icr.io/cardif-poc-namespace/cardif-poc:latest

    - name: Deploy to IBM Cloud Code Engine
      timeout-minutes: 5
      run: |
        # Verificar si el proyecto existe
        if ! ibmcloud ce project get -n cardif-poc-project; then
          echo "Project does not exist, creating it..."
          ibmcloud ce project create -n cardif-poc-project
        fi

        # Seleccionar el proyecto
        ibmcloud ce project select -n cardif-poc-project

        # Verificar si el registry secret ya existe
        if ! ibmcloud ce registry get -n cardif-poc-registry; then
          echo "Registry secret does not exist, creating it..."
          ibmcloud ce registry create --name cardif-poc-registry --server br.icr.io --username iamapikey --password ${{ secrets.IBM_CLOUD_API_KEY }}
        fi

        # Verificar si la aplicación existe
        if ibmcloud ce application get -n cardif-poc-app; then
          echo "Application exists, updating it..."
          ibmcloud ce application update \
            --name cardif-poc-app \
            --image br.icr.io/cardif-poc-namespace/cardif-poc:latest \
            --registry-secret cardif-poc-registry \
            --min-scale 1 \
            --max-scale 3 \
            --port 5000 \
            --cpu 0.5 \
            --memory 1G
        else
          echo "Application does not exist, creating it..."
          ibmcloud ce application create \
            --name cardif-poc-app \
            --image br.icr.io/cardif-poc-namespace/cardif-poc:latest \
            --registry-secret cardif-poc-registry \
            --min-scale 1 \
            --max-scale 3 \
            --port 5000 \
            --cpu 0.5 \
            --memory 1G
        fi

    - name: Cleanup on Failure
      if: failure()
      env:
        IC_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
      run: |
        echo "Previous step failed, cleaning up resources..."
        terraform destroy -auto-approve